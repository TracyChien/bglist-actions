name: Update board game data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 18 * * *'  # 每天 UTC 18:00（台灣時間凌晨 2:00）自動跑一次

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build data
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: npm run build-data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          if git diff --cached --quiet; then
            echo "沒有資料變動，略過 commit"
          else
            git commit -m "chore: update board game data"
            git push
          fi
